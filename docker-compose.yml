version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/clients/connected", "-t", "$$SYS/broker/clients/total", "-C", "1", "-W", "5"]
      interval: 5s
      timeout: 10s
      retries: 3
